services:
  backend:
    build: ./backend
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    env_file:
      - ./backend/.env
    command: python school_systems/manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"

    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - node_modules

        - action: rebuild
          path: ./backend/requirements.txt

    working_dir: /app

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules

    working_dir: /app
